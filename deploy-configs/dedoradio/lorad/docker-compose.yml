services:
  lorad:
    image: local/lorad-arm:${LORAD_VERSION}
    container_name: lorad
    privileged: true
    restart: unless-stopped
    # The host tmpfs instead of a private one, so shm is the machine's (~50% of RAM)
    # and what LoRaD pins is visible from the host. shm_size would not apply here.
    # The stream generator renices itself and runs its pacing threads realtime.
    cap_add: ["SYS_NICE"]
    cpu_shares: 4096
    oom_score_adj: -800
    ports: ["5475:5475", "5476:5476", "5478:5478"]
    env_file: .env
    tmpfs:
      - /tmp
    volumes:
      - type: bind
        source: /opt/radio/lorad/data
        target: /data/
      - type: bind
        source: /dev/shm
        target: /dev/shm
  lorad-front:
    image: local/lorad-front-arm:${LORAD_VERSION}
    container_name: lorad-front
    privileged: true
    restart: unless-stopped
    # Static files; it can wait when the box is busy.
    cpu_shares: 256
    ports: ["5477:5477"]
    env_file: .env
