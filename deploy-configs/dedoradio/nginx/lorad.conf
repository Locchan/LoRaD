server {
    listen 80;
    server_name _;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        return 301 /ui/;
    }

    location /ui/ {
        proxy_pass http://127.0.0.1:5477/ui/;
    }

    location /radio {
        proxy_pass http://127.0.0.1:5475/;
        proxy_buffering off;
    }

    # The WebSocket API is a separate threaded server on 5478. Upgrade needs HTTP/1.1,
    # and the socket idles between pushes, so the read timeout has to outlive them.
    location /radio/ws/ {
        proxy_pass http://127.0.0.1:5478/;
        proxy_http_version 1.1;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /radio/api/ {
        proxy_pass http://127.0.0.1:5476/;
        add_header 'Access-Control-Allow-Origin' '$http_origin' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization,Content-Type,X-Requested-With' always;

        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '$http_origin' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization,Content-Type,X-Requested-With' always;
            add_header 'Access-Control-Max-Age' 1728000;
            return 204;
        }

    }
}
