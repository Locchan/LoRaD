# Public entry for radio.locchan.dev.
# Frontend container serves the UI under /ui/. Backend: 5475 stream, 5476 REST, 5478 WS.
# Paths must match frontend build args in /opt/services/lorad/config.

server {
  server_name radio.locchan.dev;
  access_log /var/log/nginx/radio.log;

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  location / {
    return 301 /ui/;
  }

  location /ui/ {
    proxy_pass http://127.0.0.1:5477/ui/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location /lorad/api/ {
    proxy_pass http://127.0.0.1:5476/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    add_header 'Access-Control-Allow-Origin' '$http_origin' always;
    add_header 'Access-Control-Allow-Credentials' 'true' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Authorization,Content-Type,X-Requested-With' always;
    add_header 'Access-Control-Expose-Headers' 'X-Background-Date' always;

    if ($request_method = 'OPTIONS') {
      add_header 'Access-Control-Allow-Origin' '$http_origin' always;
      add_header 'Access-Control-Allow-Credentials' 'true' always;
      add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
      add_header 'Access-Control-Allow-Headers' 'Authorization,Content-Type,X-Requested-With' always;
      add_header 'Access-Control-Max-Age' 1728000;
      return 204;
    }
  }

  # Separate threaded WS server on 5478. Idles between pushes — long read timeout.
  location /lorad/ws/ {
    proxy_pass http://127.0.0.1:5478/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location /lorad/live {
    proxy_pass http://127.0.0.1:5475/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_buffering off;
  }

  listen 443 ssl; # managed by Certbot
  ssl_certificate /etc/letsencrypt/live/radio.locchan.dev/fullchain.pem; # managed by Certbot
  ssl_certificate_key /etc/letsencrypt/live/radio.locchan.dev/privkey.pem; # managed by Certbot
  include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
  if ($host = radio.locchan.dev) {
    return 301 https://$host$request_uri;
  } # managed by Certbot

  server_name radio.locchan.dev;
  listen 80;
  return 404; # managed by Certbot
}
